# Evaluation only: callers can choose their own trust anchors. Restrict access at deployment.
verification.request-trust.enabled=${REQUEST_TRUST_ENABLED:true}
notification.invalid-signature.enabled=false
# TR uyum kontrolleri (MDSS-TR-*): MA3 NES / mali muhur, ayrik imza, SIL ve
# sertifika suresi kurallari. Varsayilan zaten acik; profil bunu sabitler.
# Bkz. application.properties.
verification.tr-compliance.enabled=${TR_COMPLIANCE_CHECKS_ENABLED:true}
# Siki referans kullanimi (MA3 force-strict-reference-use=true). Bkz. application.properties.
verification.tr-compliance.strict-reference-enabled=${TR_STRICT_REFERENCE_ENABLED:true}
# Runtime policy activation is NOT enabled by this profile. It is a separate feature flag
# (POLICY_ACTIVATION_ENABLED=true), built only for TÜBİTAK Uyum Değerlendirme deployments.
# Never enable it in production.
